<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="INDEX.CSS">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VICTOR DANIEL'S CALCULATOR</title>
</head>
<body>
    <H1>CALCULATOR LAYOUT</H1>
    <div id="calculator">
    <div class="shape">
            <div>
            <input type="text" placeholder="0" id="display">
        </div><br>
        <div>
            <button class="function">sin</button>
              <button class="function">cos</button>
                <button class="function">tan</button>
                <button class="function">log</button>
                </div>
                <div>
                <button class="function">%</button>
                <button class="function">()</button>
                <button class="function">del</button>
                <button class="function">ac</button>
                </div>
                <div>
                <button class="value">1</button>
                <button class="value">2</button>
                <button class="value">3</button>
                <button class="operator">/</button>
                </div>
                <div>
                <button class="value">4</button>
                <button class="value">5</button>
                <button class="value">6</button>
                <button class="operator">*</button>
                </div>
                <div>
                <button class="value">7</button>
                <button class="value">8</button>
                <button class="value">9</button>
                <button class="operator">-</button>
                </div>
                <div>
                <button class="value">00</button>
                <button class="value">0</button>
                <button class="value">.</button>
                <button class="operator">+</button>
                </div>
                <div>
                <button class="function">e</button>
                <button class="function">+/-</button>
                <button  class="function">C</button>
                <button class="operator">=</button>
                </div>

</body>
</html>
